function runOnboarding(){
  if(Store.data.settings.onboardingDone) return;
  const body = '<p style="color:var(--text-2);margin-bottom:16px">A premium offline retail management system. Let\'s set up your shop.</p>'+
    '<div class="form-grid">'+
      field('Shop Name', input('shopName','Padma Store','text','required'),{req:true,full:true})+
      field('Owner Name', input('ownerName','','text'))+
      field('Phone', input('phone','','text'))+
      field('Currency Symbol', input('currencySymbol','₹','text'))+
      field('Theme', selectEl('theme',[{value:'light',label:'Light'},{value:'dark',label:'Dark'}],'light'))+
      field('Load Sample Data', selectEl('sample',[{value:'no',label:'No — start fresh'},{value:'yes',label:'Yes — add demo products'}],'no'),{full:true,hint:'Demo data can be cleared from Settings.'})+
    '</div>';
  openModal({
    title:'Welcome to PADMA RMS', body:body, size:'lg', saveText:'Get Started',
    onSave: function(data){
      Store.data.shop.name = data.shopName||'Padma Store';
      Store.data.shop.ownerName = data.ownerName||'';
      Store.data.shop.phone = data.phone||'';
      Store.data.shop.currencySymbol = data.currencySymbol||'₹';
      Store.data.settings.theme = data.theme||'light';
      if(data.sample==='yes') seedSampleData();
      Store.data.settings.onboardingDone = true;
      Store.save();
      document.documentElement.dataset.theme = Store.data.settings.theme;
      const tt = document.getElementById('theme-toggle');
      if(tt) tt.innerHTML = Store.data.settings.theme==='dark'?icon('sun'):icon('moon');
      toast('Welcome to PADMA RMS!');
      setTimeout(function(){ navigate('dashboard'); }, 100);
    }
  });
}

function seedSampleData(){
  const cats = [{id:'cat1',name:'Beverages',colorIdx:1},{id:'cat2',name:'Snacks',colorIdx:2},{id:'cat3',name:'Stationery',colorIdx:3},{id:'cat4',name:'Personal Care',colorIdx:4}];
  Store.data.categories = cats;
  const prods = [
    {name:'Green Tea 250g',cat:'cat1',price:120,buy:80,stock:40},
    {name:'Coffee Powder 500g',cat:'cat1',price:380,buy:280,stock:25},
    {name:'Potato Chips 150g',cat:'cat2',price:60,buy:40,stock:60},
    {name:'Biscuits Pack',cat:'cat2',price:40,buy:25,stock:80},
    {name:'Notebook 200 Pages',cat:'cat3',price:80,buy:50,stock:30},
    {name:'Pen Pack (10)',cat:'cat3',price:100,buy:70,stock:45},
    {name:'Toothpaste 200g',cat:'cat4',price:90,buy:60,stock:35},
    {name:'Shampoo 340ml',cat:'cat4',price:220,buy:160,stock:20}
  ];
  prods.forEach(function(p,i){
    Store.data.products.push({id:uid('prod'),name:p.name,sku:'SKU-'+(1000+i),categoryId:p.cat,sellingPrice:p.price,purchasePrice:p.buy,mrp:p.price,stock:p.stock,minStock:5,unit:'pcs',tax:0,colorIdx:assignColor(p.name),status:'active',createdAt:nowISO()});
  });
  ['Ravi Kumar','Priya Sharma','Amit Patel','Sneha Reddy'].forEach(function(n,i){
    Store.data.customers.push({id:uid('cust'),name:n,mobile:'98'+(40000000+i),city:'Mumbai',balance:0,totalPurchases:0,transactions:0,createdAt:nowISO()});
  });
  Store.data.suppliers.push({id:uid('sup'),businessName:'ABC Wholesale',contactPerson:'Ramesh',phone:'9876543210',balance:0});
  ['Arjun Mehta','Kavya Iyer'].forEach(function(n,i){
    Store.data.staff.push({id:uid('staff'),name:n,employeeId:'EMP-'+(i+1),designation:i===0?'Cashier':'Manager',salary:25000+i*5000,status:'active',joinDate:todayISO()});
  });
  for(let i=0;i<8;i++){
    const prod = Store.data.products[i%Store.data.products.length];
    const dt = new Date(); dt.setDate(dt.getDate()-i);
    Store.data.sales.unshift({
      id:uid('sale'),invoiceNo:'INV-'+String(i+1).padStart(5,'0'),date:dt.toISOString(),customerId:null,customerName:'Walk-in',
      items:[{productId:prod.id,name:prod.name,qty:2,price:prod.sellingPrice,cost:prod.purchasePrice,tax:0,discount:0,lineTotal:prod.sellingPrice*2}],
      subtotal:prod.sellingPrice*2,discount:0,tax:0,total:prod.sellingPrice*2,additionalCharges:0,
      payments:[{method:'Cash',amount:prod.sellingPrice*2}],amountPaid:prod.sellingPrice*2,balance:0,status:'completed',createdAt:nowISO()
    });
  }
  Store.data.shop.invoiceNext = 9;
}

/* ============================================================
   32. TOPBAR
   ============================================================ */
function setupTopbar(){
  const themeToggle = document.getElementById('theme-toggle');
  const notifBtn = document.getElementById('notif-btn');
  const quickAdd = document.getElementById('quick-add-btn');
  const hamburger = document.getElementById('hamburger');
  const avatar = document.getElementById('avatar');
  const searchInput = document.getElementById('global-search');

  function updateThemeIcon(){ themeToggle.innerHTML = Store.data.settings.theme==='dark'?icon('sun'):icon('moon'); }
  updateThemeIcon();
  themeToggle.onclick = function(){
    Store.data.settings.theme = Store.data.settings.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme = Store.data.settings.theme;
    updateThemeIcon();
    Store.save();
    if(App.route==='settings') renderRoute();
  };

  notifBtn.innerHTML = icon('bell');
  notifBtn.onclick = function(){
    const low = Calc.lowStock();
    const overdue = Store.data.tasks.filter(function(t){ return t.status!=='Completed' && t.dueDate && t.dueDate<todayISO(); });
    let html = '';
    low.slice(0,5).forEach(function(p){ html += '<div class="activity-item"><div class="ai-icon" style="background:var(--warning-soft);color:var(--warning)">'+icon('alert',14)+'</div><div class="ai-body"><b>'+esc(p.name)+'</b><small>Low stock — '+(p.stock||0)+' units</small></div></div>'; });
    overdue.slice(0,5).forEach(function(t){ html += '<div class="activity-item"><div class="ai-icon" style="background:var(--danger-soft);color:var(--danger)">'+icon('clock',14)+'</div><div class="ai-body"><b>'+esc(t.title)+'</b><small>Overdue</small></div></div>'; });
    if(!html) html = '<div class="empty-state" style="padding:30px">'+icon('checkcircle')+'<p>All clear!</p></div>';
    openModal({title:'Notifications', body:'<div class="activity-list">'+html+'</div>'});
  };

  quickAdd.innerHTML = icon('plus');
  quickAdd.onclick = function(){
    const body = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
      '<button type="button" class="btn btn-ghost" style="height:60px;justify-content:flex-start" data-q="pos">'+icon('cart')+' New Sale</button>'+
      '<button type="button" class="btn btn-ghost" style="height:60px;justify-content:flex-start" data-q="prod">'+icon('package')+' Add Product</button>'+
      '<button type="button" class="btn btn-ghost" style="height:60px;justify-content:flex-start" data-q="cust">'+icon('users')+' Add Customer</button>'+
      '<button type="button" class="btn btn-ghost" style="height:60px;justify-content:flex-start" data-q="exp">'+icon('dollar')+' Add Expense</button>'+
      '<button type="button" class="btn btn-ghost" style="height:60px;justify-content:flex-start" data-q="pur">'+icon('bag')+' New Purchase</button>'+
      '<button type="button" class="btn btn-ghost" style="height:60px;justify-content:flex-start" data-q="task">'+icon('listtodo')+' New Task</button>'+
    '</div>';
    openModal({title:'Quick Add', body:body});
    $$('[data-q]').forEach(function(b){
      b.onclick = function(){
        const q = b.dataset.q; closeModal();
        if(q==='pos') navigate('pos');
        else if(q==='prod') openProductModal();
        else if(q==='cust') openCustomerModal();
        else if(q==='exp') navigate('expenses');
        else if(q==='pur') navigate('purchases');
        else if(q==='task') navigate('tasks');
      };
    });
  };

  hamburger.innerHTML = icon('menu');
  hamburger.onclick = function(){ document.getElementById('sidebar').classList.toggle('open'); };

  avatar.onclick = function(){
    const shop = Store.data.shop;
    const initial = (shop.ownerName||shop.name||'P').charAt(0).toUpperCase();
    openModal({
      title:'Profile',
      body:'<div style="text-align:center;padding:20px 0"><div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#a78bfa);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin:0 auto 12px">'+esc(initial)+'</div><h3>'+esc(shop.ownerName||shop.name)+'</h3><p style="color:var(--text-3);font-size:13px">'+esc(shop.phone||'')+'</p><p style="color:var(--text-3);font-size:12px;margin-top:4px">'+esc(shop.email||'')+'</p></div>'
    });
  };

  let searchTimer;
  searchInput.oninput = function(e){
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    if(!q) return;
    searchTimer = setTimeout(function(){
      const ql = q.toLowerCase();
      const prods = Store.data.products.filter(function(p){ return (p.name||'').toLowerCase().indexOf(ql)>-1; });
      const custs = Store.data.customers.filter(function(c){ return (c.name||'').toLowerCase().indexOf(ql)>-1; });
      if(prods.length){ App.productFilter.q = q; navigate('products'); }
      else if(custs.length){ App.page.custQ = q; navigate('customers'); }
      searchInput.value='';
    }, 500);
  };
}

/* ============================================================
   33. INIT
   ============================================================ */
function init(){
  try {
    Store.load();
    document.documentElement.dataset.theme = Store.data.settings.theme||'light';
    renderNav();
    setupTopbar();
    navigate('dashboard');
    if(!Store.data.settings.onboardingDone){
      setTimeout(function(){ try { runOnboarding(); } catch(e){ console.error('Onboarding error:',e); } }, 400);
    }
  } catch(e){
    console.error('Init error:',e);
    const c = document.getElementById('page-content');
    if(c) c.innerHTML = '<div class="card" style="padding:30px;margin:40px auto;max-width:600px;border-left:4px solid var(--danger)"><h3 style="color:var(--danger);margin-bottom:10px">Application Error</h3><p style="color:var(--text-2);font-size:13px;line-height:1.6;margin-bottom:12px">'+esc(e.message||String(e))+'</p><button type="button" class="btn btn-danger" onclick="localStorage.clear();location.reload()">Reset &amp; Reload</button></div>';
  }
}

// Global Escape handler for all modals
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    const root = document.getElementById('modal-root');
    if(root && root.children.length>0) closeModal();
  }
});

// Boot
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// Expose globals
window.navigate = navigate;
window.closeModal = closeModal;
window.openProductModal = openProductModal;
window.openCustomerModal = openCustomerModal;
window.toast = toast;
</script>
</body>
</html>
