<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PADMA RMS — Retail Management System</title>
<link rel="icon" href="padma.ico" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f7fb;--surface:#fff;--surface-2:#f3f5f9;--surface-3:#eaedf3;
  --border:#e5e8ee;--border-2:#d3d8e0;
  --text:#111827;--text-2:#4b5563;--text-3:#9ca3af;
  --primary:#6366f1;--primary-2:#4f46e5;--primary-soft:#eef2ff;
  --success:#10b981;--success-soft:#d1fae5;
  --danger:#ef4444;--danger-soft:#fee2e2;
  --warning:#f59e0b;--warning-soft:#fef3c7;
  --info:#3b82f6;--info-soft:#dbeafe;
  --p-lav:#E9DFFF;--p-blue:#DCEBFF;--p-mint:#D9F3E5;--p-peach:#FFE3D5;
  --p-pink:#F8DFEA;--p-butter:#FFF0C2;--p-aqua:#D7F2F0;--p-lilac:#E8E2FA;
  --p-coral:#F8D8D2;--p-sage:#DFEBDD;
  --on-lav:#7c3aed;--on-blue:#2563eb;--on-mint:#059669;--on-peach:#ea580c;
  --on-pink:#db2777;--on-butter:#a16207;--on-aqua:#0891b2;--on-lilac:#7c3aed;
  --on-coral:#dc2626;--on-sage:#16a34a;
  --sidebar-w:248px;--topbar-h:60px;
  --radius:10px;--radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 4px 14px rgba(16,24,40,.08);
  --shadow-lg:0 20px 48px rgba(16,24,40,.16);
  --font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --bg:#0d0f13;--surface:#15181e;--surface-2:#1b1f27;--surface-3:#232830;
  --border:#252b36;--border-2:#343c4b;
  --text:#e7e9ee;--text-2:#a3a9b6;--text-3:#6b7280;
  --primary:#818cf8;--primary-2:#6366f1;--primary-soft:#1e1b4b;
  --success:#34d399;--success-soft:#064e3b;
  --danger:#f87171;--danger-soft:#450a0a;
  --warning:#fbbf24;--warning-soft:#451a03;
  --info:#60a5fa;--info-soft:#172554;
  --p-lav:#2d2440;--p-blue:#1c2f4a;--p-mint:#14322a;--p-peach:#422a1e;
  --p-pink:#3d1f2c;--p-butter:#3d3018;--p-aqua:#173330;--p-lilac:#2a2440;
  --p-coral:#3a221c;--p-sage:#243226;
  --on-lav:#c4b5fd;--on-blue:#93c5fd;--on-mint:#6ee7b7;--on-peach:#fdba74;
  --on-pink:#f9a8d4;--on-butter:#fde047;--on-aqua:#67e8f9;--on-lilac:#c4b5fd;
  --on-coral:#fca5a5;--on-sage:#86efac;
}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--primary);text-decoration:none}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* CURSORS */
.btn,.icon-btn,.btn-icon,.nav-item,.chip,.att-btn,.prod-card,.tab,.switch,.kpi{cursor:pointer}

/* LAYOUT */
#app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50;transition:transform .25s ease}
.brand{height:var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border)}
.brand img{width:30px;height:30px;border-radius:8px;object-fit:contain;background:var(--primary-soft);padding:2px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#a78bfa);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text b{font-size:15px;letter-spacing:-.2px}
.brand-text span{font-size:10px;color:var(--text-3);font-weight:500;text-transform:uppercase;letter-spacing:.8px}
.nav{flex:1;overflow-y:auto;padding:10px 8px 18px}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);padding:14px 10px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--text-2);font-size:13.5px;font-weight:500;transition:background .15s,color .15s;margin-bottom:1px;position:relative}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary-2)}
[data-theme="dark"] .nav-item.active{color:var(--primary)}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.nav-item.active svg{opacity:1}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);text-align:center}

.main{flex:1;margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column;transition:margin .25s}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:0 20px}
.topbar-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3)}
.breadcrumb b{color:var(--text);font-weight:600}
.search-box{position:relative;max-width:380px;flex:1;margin-left:8px}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3);pointer-events:none}
.search-box input{width:100%;height:36px;padding:0 12px 0 34px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);font-size:13px;outline:none;transition:border .15s,background .15s}
.search-box input:focus{border-color:var(--primary);background:var(--surface)}
.topbar-right{display:flex;align-items:center;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .15s,color .15s;position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.notif-dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#a78bfa);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-left:4px}
.hamburger{display:none}

.content{flex:1;padding:22px 24px 40px;max-width:100%;overflow-x:hidden}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.4px}
.page-head p{color:var(--text-2);font-size:13px;margin-top:3px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:600;transition:background .15s,transform .1s;border:1px solid transparent;white-space:nowrap;justify-content:center}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2)}
.btn-ghost{background:var(--surface);color:var(--text-2);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.93)}
.btn-success{background:var(--success);color:#fff}
.btn-sm{height:30px;padding:0 10px;font-size:12px}
.btn-sm svg{width:13px;height:13px}
.btn-icon{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2)}
.btn-icon:hover{background:var(--surface-2);color:var(--text)}
.btn-icon svg{width:15px;height:15px}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.card-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-head h3{font-size:14.5px;font-weight:700}
.card-head small{color:var(--text-3);font-size:11.5px}
.card-body{padding:16px 18px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.kpi-icon svg{width:19px;height:19px}
.kpi-label{font-size:12px;color:var(--text-2);font-weight:500;margin-bottom:2px}
.kpi-value{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:11px;color:var(--text-3);margin-top:5px}

/* TABLES */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.tbl-toolbar{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface)}
.tbl-toolbar .search-box{max-width:300px;margin-left:0}
.tbl-toolbar select{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:12.5px;outline:none}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--surface-2)}
th{text-align:left;font-weight:600;color:var(--text-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:11px 14px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-empty{padding:48px 20px;text-align:center;color:var(--text-3)}
.tbl-empty svg{width:40px;height:40px;margin:0 auto 10px;opacity:.4}
.tbl-actions{display:flex;gap:2px}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-muted{background:var(--surface-3);color:var(--text-2)}
.badge-primary{background:var(--primary-soft);color:var(--primary-2)}
[data-theme="dark"] .badge-primary{color:var(--primary)}

/* FORMS */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.field>span{font-weight:600;color:var(--text-2);font-size:12px}
.field>span .req{color:var(--danger);font-style:normal}
.field input,.field select,.field textarea{width:100%;height:36px;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;outline:none;transition:border .15s,box-shadow .15s}
.field textarea{height:auto;min-height:64px;padding:8px 11px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field small{font-size:11px;color:var(--text-3)}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,20,30,.55);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:560px;overflow:hidden;border:1px solid var(--border);animation:pop .18s ease}
.modal-sm{max-width:400px}.modal-lg{max-width:820px}.modal-xl{max-width:1080px}
.modal-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:700}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 20px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);background:var(--surface-2)}
#modal-form{display:contents}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}

/* TOAST */
#toast-root{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:2000;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--success);border-radius:10px;padding:12px 16px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transform:translateX(20px);transition:opacity .25s,transform .25s;max-width:360px;pointer-events:auto}
.toast.show{opacity:1;transform:none}
.toast-error{border-left-color:var(--danger)}
.toast-warning{border-left-color:var(--warning)}
.toast-info{border-left-color:var(--info)}

/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.dash-grid .col-8{grid-column:span 8}
.dash-grid .col-6{grid-column:span 6}
.dash-grid .col-4{grid-column:span 4}
.dash-grid .col-12{grid-column:span 12}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm)}
.chart-card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.chart-card small{font-size:11.5px;color:var(--text-3)}
.chart-wrap{margin-top:12px}
.activity-list{display:flex;flex-direction:column}
.activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center}
.activity-item:last-child{border-bottom:none}
.activity-item .ai-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.activity-item .ai-icon svg{width:15px;height:15px}
.activity-item .ai-body{flex:1;min-width:0}
.activity-item .ai-body b{font-size:13px;display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-item .ai-body small{font-size:11.5px;color:var(--text-3)}
.activity-item .ai-val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* POS */
.pos-layout{display:grid;grid-template-columns:1fr 400px;gap:14px;min-height:calc(100vh - 140px)}
.pos-products{display:flex;flex-direction:column;gap:12px;min-width:0}
.pos-search{display:flex;gap:10px}
.pos-search .search-box{max-width:none;flex:1;margin-left:0}
.pos-search select{height:38px;min-width:150px;padding:0 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-size:13px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow-y:auto;padding-right:4px}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:8px}
.prod-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-2)}
.prod-card.out{opacity:.5;cursor:not-allowed}
.prod-card .pc-img{width:100%;aspect-ratio:1.4;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.prod-card .pc-img svg{width:26px;height:26px}
.prod-card .pc-name{font-size:12.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.prod-card .pc-meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px}
.prod-card .pc-price{font-weight:700;color:var(--text)}
.prod-card .pc-stock{color:var(--text-3)}
.pos-cart{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden;height:calc(100vh - 140px);position:sticky;top:calc(var(--topbar-h) + 14px)}
.cart-head{padding:14px 16px;border-bottom:1px solid var(--border)}
.cart-head h3{font-size:14px;font-weight:700;margin-bottom:10px}
.cart-cust{display:flex;gap:8px}
.cart-cust select{flex:1;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);font-size:12.5px}
.cart-items{flex:1;overflow-y:auto;padding:8px 12px}
.cart-empty{text-align:center;padding:40px 20px;color:var(--text-3);font-size:12.5px}
.cart-item{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);align-items:center}
.cart-item:last-child{border-bottom:none}
.cart-item .ci-body{flex:1;min-width:0}
.cart-item .ci-body b{font-size:12.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item .ci-body small{font-size:11px;color:var(--text-3)}
.qty-ctrl{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.qty-ctrl button{width:22px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--text-2);font-weight:700}
.qty-ctrl button:hover{background:var(--surface-2)}
.qty-ctrl input{width:32px;height:24px;border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);text-align:center;background:var(--surface);color:var(--text);font-size:12px;outline:none}
.cart-item .ci-total{font-weight:700;font-size:12.5px;min-width:60px;text-align:right;font-variant-numeric:tabular-nums}
.cart-totals{padding:12px 16px;border-top:1px solid var(--border);background:var(--surface-2);font-size:12.5px}
.cart-row{display:flex;justify-content:space-between;padding:4px 0;color:var(--text-2);align-items:center}
.cart-row.grand{font-size:16px;font-weight:800;color:var(--text);padding-top:8px;margin-top:6px;border-top:1px dashed var(--border-2)}
.cart-row input{width:80px;text-align:right;border:1px solid var(--border);border-radius:6px;padding:2px 6px;background:var(--surface);color:var(--text);font-size:12px}
.cart-foot{padding:12px 14px;display:flex;gap:8px;border-top:1px solid var(--border)}
.cart-foot .btn{flex:1}

/* MISC */
.prod-thumb{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prod-thumb svg{width:16px;height:16px}
.prod-cell{display:flex;align-items:center;gap:10px}
.prod-cell b{font-weight:600;font-size:13px;display:block}
.prod-cell small{font-size:11px;color:var(--text-3)}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:20px;background:var(--surface-2);color:var(--text-2);font-size:12px;font-weight:500;border:1px solid transparent;transition:background .15s,border .15s}
.chip.active{background:var(--primary-soft);color:var(--primary-2);border-color:var(--primary)}
[data-theme="dark"] .chip.active{color:var(--primary)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat-block{background:var(--surface-2);border-radius:10px;padding:14px}
.stat-block .sb-label{font-size:11.5px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-block .sb-val{font-size:20px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty-state svg{width:56px;height:56px;margin:0 auto 14px;opacity:.35}
.empty-state h3{font-size:15px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.empty-state p{font-size:13px;margin-bottom:16px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px;padding:6px 0}
.kv dt{color:var(--text-3);font-weight:500}
.kv dd{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kan-col{background:var(--surface-2);border-radius:11px;padding:10px;min-height:200px}
.kan-col h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-2);margin-bottom:10px;display:flex;justify-content:space-between}
.kan-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s}
.kan-card:hover{box-shadow:var(--shadow)}
.kan-card b{font-size:12.5px;font-weight:600;display:block;margin-bottom:4px}
.kan-card small{font-size:11px;color:var(--text-3)}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.cal-dow{background:var(--surface-2);padding:8px;font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;text-align:center}
.cal-day{background:var(--surface);min-height:88px;padding:6px;font-size:11px;position:relative;transition:background .1s}
.cal-day:hover{background:var(--surface-2)}
.cal-day.other{color:var(--text-3);background:var(--surface-2)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--primary)}
.cal-day .cd-num{font-weight:700;color:var(--text);margin-bottom:3px}
.cal-day.other .cd-num{color:var(--text-3)}
.cal-evt{font-size:10px;padding:1px 5px;border-radius:4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--primary-soft);color:var(--primary-2);font-weight:600}
[data-theme="dark"] .cal-evt{color:var(--primary)}

/* ATTENDANCE */
.att-actions{display:flex;gap:4px;flex-wrap:wrap}
.att-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.att-btn.P{background:var(--success-soft);color:var(--success);border-color:var(--success)}
.att-btn.A{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.att-btn.H{background:var(--warning-soft);color:var(--warning);border-color:var(--warning)}
.att-btn.L{background:var(--info-soft);color:var(--info);border-color:var(--info)}

/* SETTINGS */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);gap:16px}
.setting-row:last-child{border-bottom:none}
.setting-row .sr-label b{font-size:13px;font-weight:600;display:block}
.setting-row .sr-label small{font-size:12px;color:var(--text-3)}
.switch{position:relative;width:40px;height:22px;background:var(--border-2);border-radius:20px;transition:background .2s;flex-shrink:0}
.switch.on{background:var(--primary)}
.switch::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on::after{left:20px}

/* INVOICE */
.invoice{background:#fff;color:#111;padding:30px;max-width:780px;margin:0 auto;font-size:13px}
.invoice h2{font-size:22px;margin-bottom:2px;color:#111}
.invoice .inv-head{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:14px;margin-bottom:16px}
.invoice table{font-size:12px;color:#111}
.invoice th{background:#f3f4f6;color:#111;text-transform:none;letter-spacing:0}
.invoice td,.invoice th{border-color:#e5e7eb;color:#111}
.invoice .totals{margin-left:auto;width:280px;margin-top:14px}
.invoice .totals .row{display:flex;justify-content:space-between;padding:4px 0}
.invoice .totals .row.grand{border-top:2px solid #111;padding-top:8px;margin-top:6px;font-weight:800;font-size:15px}

/* RESPONSIVE */
@media (max-width:1200px){
  .dash-grid .col-8,.dash-grid .col-6{grid-column:span 12}
  .dash-grid .col-4{grid-column:span 6}
  .pos-layout{grid-template-columns:1fr 360px}
}
@media (max-width:1024px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .hamburger{display:flex}
  .pos-layout{grid-template-columns:1fr}
  .pos-cart{height:auto;position:static}
  .dash-grid .col-4{grid-column:span 12}
  .kanban{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  .content{padding:16px}
  .page-head h1{font-size:20px}
  .kpi-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .search-box{max-width:180px}
  .breadcrumb{display:none}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .kanban{grid-template-columns:1fr}
  .modal-backdrop{padding:16px 8px}
}
@media (max-width:480px){
  .topbar{padding:0 12px}
  .content{padding:12px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .search-box{display:none}
  .page-actions .btn{height:32px;font-size:12px;padding:0 10px}
}
</style>
</head>

const STORE_KEY = 'padma_rms_v1';

const Store = {

  load: function(){

      if(!this.data.shop) this.data.shop = def.shop;
      if(!this.data.settings) this.data.settings = def.settings;
      for(const k in def.shop){ if(this.data.shop[k]===undefined) this.data.shop[k]=def.shop[k]; }
      for(const k in def.settings){ if(this.data.settings[k]===undefined) this.data.settings[k]=def.settings[k]; }
    } catch(e){
      console.error('Store load error:',e);
      this.data = DEFAULTS();
    }
  },
  save: function(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); }
    catch(e){ console.error('Store save error:',e); }
  },
  reset: function(){ this.data = DEFAULTS(); this.save(); },
  add: function(collection,rec){
    if(!rec.id) rec.id = uid(collection.slice(0,3));
    if(!rec.createdAt) rec.createdAt = nowISO();
    this.data[collection].unshift(rec);
    this.save();
    return rec;
  },
  update: function(collection,id,patch){
    const arr = this.data[collection];
    for(let i=0;i<arr.length;i++){
      if(arr[i].id===id){
        for(const k in patch) arr[i][k] = patch[k];
        arr[i].updatedAt = nowISO();
        this.save();
        return arr[i];
      }
    }
    return null;
  },
  remove: function(collection,id){
    const arr = this.data[collection];
    for(let i=0;i<arr.length;i++){ if(arr[i].id===id){ arr.splice(i,1); this.save(); return true; } }
    return false;
  },
  find: function(collection,id){ const arr = this.data[collection]; for(let i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
};

function toast(msg,type){
  type = type||'success';
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast toast-'+type;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){ el.classList.add('show'); },10);
  setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); },3000);
}

function closeModal(){
  const root = document.getElementById('modal-root');
  if(root) root.innerHTML = '';
}

function openModal(opts){
  opts = opts||{};
  const title = opts.title||'Dialog';
  const body = opts.body||'';
  const onSave = opts.onSave;
  const saveText = opts.saveText||'Save';
  const size = opts.size||'md';
  const root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" id="mb">'+
      '<div class="modal modal-'+size+'">'+
        '<div class="modal-head">'+
          '<h3>'+esc(title)+'</h3>'+
          '<button type="button" class="btn-icon" id="modal-x">'+icon('x')+'</button>'+
        '</div>'+
        '<form id="modal-form">'+
          '<div class="modal-body">'+body+'</div>'+
          '<div class="modal-foot">'+
            '<button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>'+
            (onSave?'<button type="submit" class="btn btn-primary" id="modal-save">'+esc(saveText)+'</button>':'')+
          '</div>'+
        '</form>'+
      '</div>'+
    '</div>';

  document.getElementById('modal-x').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('mb').addEventListener('click', function(e){ if(e.target && e.target.id==='mb') closeModal(); });

  const form = document.getElementById('modal-form');
  if(onSave){
    form.onsubmit = function(ev){
      ev.preventDefault();
      let data;
      try { data = {}; const fd = new FormData(form); fd.forEach(function(v,k){ data[k]=v; }); }
      catch(e){ console.error(e); toast('Form error','error'); return; }
      let ok = true;
      try { ok = onSave(data, form); }
      catch(e){ console.error('onSave error:',e); toast('Error: '+e.message,'error'); return; }
      if(ok !== false) closeModal();
    };
  }

  // focus first input
  setTimeout(function(){
    const first = form.querySelector('input:not([type=hidden]):not([readonly]),select,textarea');
    if(first) first.focus();
  }, 60);
}

function askConfirm(msg,onYes,danger){
  danger = danger!==false;
  const root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" id="cf-bg">'+
      '<div class="modal modal-sm">'+
        '<div class="modal-head"><h3>Confirm</h3></div>'+
        '<div class="modal-body"><p style="font-size:13.5px;line-height:1.6">'+esc(msg)+'</p></div>'+
        '<div class="modal-foot">'+
          '<button type="button" class="btn btn-ghost" id="cf-no">Cancel</button>'+
          '<button type="button" class="btn '+(danger?'btn-danger':'btn-primary')+'" id="cf-yes">Confirm</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  document.getElementById('cf-no').onclick = closeModal;
  document.getElementById('cf-yes').onclick = function(){ closeModal(); try { onYes(); } catch(e){ console.error(e); toast('Error: '+e.message,'error'); } };
  document.getElementById('cf-bg').addEventListener('click', function(e){ if(e.target && e.target.id==='cf-bg') closeModal(); });
}

/* ============================================================
   7. CALC (financial computations)
   ============================================================ */
const Calc = {
  saleCost: function(sale){ return sum(sale.items||[], function(it){ return (it.cost||0)*(it.qty||0); }); },
  todaySales: function(){ const t=todayISO(); return Store.data.sales.filter(function(s){ return s.date && s.date.slice(0,10)===t && s.status!=='cancelled'; }); },
  monthSales: function(){ const dt=new Date(); const y=dt.getFullYear(),m=dt.getMonth(); return Store.data.sales.filter(function(s){ if(!s.date||s.status==='cancelled') return false; const d=new Date(s.date); return d.getFullYear()===y&&d.getMonth()===m; }); },
  totalRevenue: function(){ return sum(Store.data.sales.filter(function(s){return s.status!=='cancelled';}), function(s){ return (s.total||0)-(s.refunded||0); }); },
  totalCOGS: function(){ return sum(Store.data.sales.filter(function(s){return s.status!=='cancelled';}), Calc.saleCost); },
  grossProfit: function(){ return this.totalRevenue()-this.totalCOGS(); },
  totalExpenses: function(){ return sum(Store.data.expenses, function(e){ return e.amount; }); },
  netProfit: function(){ return this.grossProfit()-this.totalExpenses(); },
  receivables: function(){ return sum(Store.data.customers, function(c){ return Math.max(0,c.balance||0); }); },
  payables: function(){ return sum(Store.data.suppliers, function(s){ return Math.max(0,s.balance||0); }); },
  inventoryValue: function(){ return sum(Store.data.products.filter(function(p){return p.status!=='archived';}), function(p){ return (p.stock||0)*(p.purchasePrice||0); }); },
  lowStock: function(){ return Store.data.products.filter(function(p){ return p.status!=='archived' && (p.stock||0)<=(p.minStock||0); }); },
  outOfStock: function(){ return Store.data.products.filter(function(p){ return p.status!=='archived' && (p.stock||0)<=0; }); },
  todayTxn: function(){ const t=todayISO(); return Store.data.sales.filter(function(s){ return s.date && s.date.slice(0,10)===t && s.status!=='cancelled'; }).length; },
  cashBalance: function(){ let b=0; Store.data.cashTxns.forEach(function(t){ if(t.method==='Cash'||!t.method) b += (t.type==='in'?1:-1)*(t.amount||0); }); return b; },
  salesByDay: function(days){ days=days||7; const out=[]; for(let i=days-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const key=d.toISOString().slice(0,10); const total=sum(Store.data.sales.filter(function(s){ return s.date && s.date.slice(0,10)===key && s.status!=='cancelled'; }), function(s){ return s.total; }); out.push({label:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}), value:total}); } return out; },
  salesByMonth: function(months){ months=months||6; const out=[]; for(let i=months-1;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); d.setDate(1); const y=d.getFullYear(),m=d.getMonth(); const total=sum(Store.data.sales.filter(function(s){ if(!s.date||s.status==='cancelled') return false; const dd=new Date(s.date); return dd.getFullYear()===y&&dd.getMonth()===m; }), function(s){ return s.total; }); const exp=sum(Store.data.expenses.filter(function(e){ if(!e.date) return false; const dd=new Date(e.date); return dd.getFullYear()===y&&dd.getMonth()===m; }), function(e){ return e.amount; }); out.push({label:d.toLocaleDateString('en-IN',{month:'short'}), value:total, value2:exp}); } return out; },
  paymentDistribution: function(){ const m={}; Store.data.sales.filter(function(s){return s.status!=='cancelled';}).forEach(function(s){ (s.payments||[]).forEach(function(p){ m[p.method]=(m[p.method]||0)+p.amount; }); }); const out=[]; for(const k in m) out.push({label:k,value:m[k]}); return out; },
  topProducts: function(limit){ limit=limit||5; const m={}; Store.data.sales.filter(function(s){return s.status!=='cancelled';}).forEach(function(s){ (s.items||[]).forEach(function(it){ if(!m[it.productId]) m[it.productId]={name:it.name,qty:0,revenue:0}; m[it.productId].qty+=it.qty; m[it.productId].revenue+=it.lineTotal||0; }); }); const arr=[]; for(const k in m) arr.push(m[k]); arr.sort(function(a,b){return b.revenue-a.revenue;}); return arr.slice(0,limit); }
};

/* ============================================================
   8. CHARTS
   ============================================================ */
function svgLine(data,opts){
  opts = opts||{};
  const height = opts.height||200, color = opts.color||'var(--primary)';
  const W=600,H=height,pad={t:14,r:14,b:28,l:44};
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const vals = data.map(function(d){ return Math.max(d.value,d.value2||0); });
  const max = Math.max.apply(null, vals.concat([1]));
  const n = Math.max(data.length,1);
  function px(i){ return pad.l + (n<=1?cw/2:(i/(n-1))*cw); }
  function py(v){ return pad.t + ch - (v/max)*ch; }
  let grid='';
  for(let i=0;i<=4;i++){ const y=pad.t+(ch/4)*i; const v=max-(max/4)*i; grid += '<line x1="'+pad.l+'" y1="'+y+'" x2="'+(pad.l+cw)+'" y2="'+y+'" stroke="var(--border)" stroke-dasharray="2,3"/><text x="'+(pad.l-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="var(--text-3)">'+Math.round(v)+'</text>'; }
  let path = '';
  for(let i=0;i<data.length;i++){ path += (i===0?'M':'L')+px(i)+','+py(data[i].value); }
  let area = '';
  if(data.length) area = path+' L'+px(n-1)+','+(pad.t+ch)+' L'+px(0)+','+(pad.t+ch)+' Z';
  let dots='';
  for(let i=0;i<data.length;i++) dots += '<circle cx="'+px(i)+'" cy="'+py(data[i].value)+'" r="3" fill="var(--surface)" stroke="'+color+'" stroke-width="2"/>';
  let xlabels='';
  const step = Math.ceil(n/8);
  for(let i=0;i<data.length;i++){ if(n<=10||i%step===0||i===n-1) xlabels += '<text x="'+px(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--text-3)">'+esc(data[i].label)+'</text>'; }
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+height+'px;display:block">'+
    '<defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".28"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path d="'+area+'" fill="url(#lg1)"/>'+
    '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>'+dots+xlabels+'</svg>';
}
function svgBar(data,opts){
  opts=opts||{};
  const height=opts.height||220, color=opts.color||'var(--primary)', secondColor=opts.secondColor||'var(--danger)', dual=!!opts.dual;
  const W=600,H=height,pad={t:12,r:12,b:32,l:44};
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const vals = data.map(function(d){ return Math.max(d.value,d.value2||0); });
  const max = Math.max.apply(null, vals.concat([1]));
  const n = Math.max(data.length,1);
  const bw = cw/n;
  let grid='';
  for(let i=0;i<=4;i++){ const y=pad.t+(ch/4)*i; const v=max-(max/4)*i; grid += '<line x1="'+pad.l+'" y1="'+y+'" x2="'+(pad.l+cw)+'" y2="'+y+'" stroke="var(--border)" stroke-dasharray="2,3"/><text x="'+(pad.l-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="var(--text-3)">'+Math.round(v)+'</text>'; }
  let bars='';
  for(let i=0;i<data.length;i++){
    const d = data[i];
    const h = (d.value/max)*ch;
    const x = pad.l + i*bw + bw*0.18;
    const w = bw*0.64;
    bars += '<rect x="'+x+'" y="'+(pad.t+ch-h)+'" width="'+w+'" height="'+h+'" rx="3" fill="'+color+'"/>';
    if(dual){
      const h2 = ((d.value2||0)/max)*ch;
      bars += '<rect x="'+(x+w+3)+'" y="'+(pad.t+ch-h2)+'" width="'+(w*0.55)+'" height="'+h2+'" rx="3" fill="'+secondColor+'"/>';
    }
    const step = Math.ceil(n/10);
    if(n<=12||i%step===0) bars += '<text x="'+(pad.l+i*bw+bw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="9.5" fill="var(--text-3)">'+esc(d.label)+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+height+'px;display:block">'+grid+bars+'</svg>';
}
function svgDonut(data,size){
  size = size||200;
  const total = sum(data, function(d){ return d.value; })||1;
  const cx=size/2, cy=size/2, r=68;
  const C = 2*Math.PI*r;
  let acc = 0, arcs='';
  for(let i=0;i<data.length;i++){
    const d = data[i];
    const frac = d.value/total;
    const dash = frac*C, gap = C-dash;
    const col = pc(i).fg;
    arcs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="22" stroke-dasharray="'+dash+' '+gap+'" stroke-dashoffset="'+(-acc)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    acc += dash;
  }
  return '<svg viewBox="0 0 '+size+' '+size+'" style="width:100%;max-width:'+size+'px;height:auto;display:block;margin:0 auto">'+arcs+
    '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text)">'+fmtNum(total)+'</text>'+
    '<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="10" fill="var(--text-3)">Total</text></svg>';
}

  D.tasks.filter(function(t){return t.status!=='Completed';}).slice(0,3).forEach(function(t){ alertsHtml += '<div class="activity-item"><div class="ai-icon" style="background:var(--info-soft);color:var(--info)">'+icon('listtodo',15)+'</div><div class="ai-body"><b>'+esc(t.title)+'</b><small>'+esc(t.priority||'Low')+' · '+fmtDate(t.dueDate)+'</small></div></div>'; });

  let legendHtml = '';
  payDist.forEach(function(p,i){ legendHtml += '<span><i style="background:'+pc(i).fg+'"></i>'+esc(p.label)+'</span>'; });

  c.innerHTML =
    '<div class="page-head">'+
      '<div><h1>Dashboard</h1><p>Welcome back — here\'s what\'s happening in your shop.</p></div>'+
      '<div class="page-actions">'+
        '<button type="button" class="btn btn-ghost" id="db-refresh">'+icon('refresh')+' Refresh</button>'+
        '<button type="button" class="btn btn-primary" id="db-new-sale">'+icon('plus')+' New Sale</button>'+
      '</div>'+
    '</div>'+
    '<div class="kpi-grid">'+kpiHtml+'</div>'+
    '<div class="dash-grid">'+
      '<div class="col-8"><div class="chart-card"><h3>Sales — Last 7 Days</h3><small>Daily revenue</small><div class="chart-wrap">'+svgLine(sales7,{height:230,color:'var(--primary)'})+'</div></div></div>'+
      '<div class="col-4"><div class="chart-card"><h3>Payment Methods</h3><small>Distribution</small><div class="chart-wrap">'+(payDist.length?svgDonut(payDist,200):'<div class="empty-state" style="padding:20px"><p>No payments yet</p></div>')+'</div><div class="legend">'+legendHtml+'</div></div></div>'+
      '<div class="col-6"><div class="chart-card"><h3>Monthly Sales vs Expenses</h3><small>Last 6 months</small><div class="chart-wrap">'+svgBar(monthly,{height:220,dual:true,color:'var(--primary)',secondColor:'var(--danger)'})+'</div><div class="legend"><span><i style="background:var(--primary)"></i>Sales</span><span><i style="background:var(--danger)"></i>Expenses</span></div></div></div>'+
      '<div class="col-6"><div class="chart-card"><h3>Top Selling Products</h3><small>By revenue</small><div class="activity-list" style="margin-top:10px">'+topHtml+'</div></div></div>'+
      '<div class="col-6"><div class="chart-card"><h3>Recent Activity</h3><small>Latest events</small><div class="activity-list" style="margin-top:10px">'+activityHtml+'</div></div></div>'+
      '<div class="col-6"><div class="chart-card"><h3>Alerts & Tasks</h3><small>Things needing attention</small><div class="activity-list" style="margin-top:10px">'+alertsHtml+'</div></div></div>'+
    '</div>';

  document.getElementById('db-refresh').onclick = renderRoute;
  document.getElementById('db-new-sale').onclick = function(){ navigate('pos'); };
};

/* ============================================================

   ============================================================ */
ROUTES.pos = function(c){
  const D = Store.data;
  if(!App.pos) App.pos = { cart:[], customerId:'', discount:0, additionalCharges:0 };

  c.innerHTML =
    '<div class="page-head"><div><h1>Billing / POS</h1><p>Fast counter billing · F2 search · F9 pay</p></div>'+
    '<div class="page-actions"><button type="button" class="btn btn-ghost" id="pos-hold">'+icon('clock')+' Hold</button><button type="button" class="btn btn-ghost" id="pos-clear">'+icon('refresh')+' Clear</button></div></div>'+
    '<div class="pos-layout">'+
      '<div class="pos-products">'+
        '<div class="pos-search">'+
          '<div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="pos-search" placeholder="Search products, SKU, barcode..." autocomplete="off"></div>'+
          '<select id="pos-cat"><option value="">All Categories</option>'+D.categories.map(function(cat){ return '<option value="'+cat.id+'">'+esc(cat.name)+'</option>'; }).join('')+'</select>'+
        '</div>'+
        '<div class="product-grid" id="pos-grid"></div>'+
      '</div>'+
      '<div class="pos-cart">'+
        '<div class="cart-head"><h3>Current Bill</h3><div class="cart-cust"><select id="pos-cust"><option value="">Walk-in Customer</option>'+D.customers.map(function(cu){ return '<option value="'+cu.id+'">'+esc(cu.name)+(cu.mobile?' — '+esc(cu.mobile):'')+'</option>'; }).join('')+'</select></div></div>'+
        '<div class="cart-items" id="pos-cart"></div>'+
        '<div class="cart-totals" id="pos-totals"></div>'+
        '<div class="cart-foot"><button type="button" class="btn btn-ghost" id="pos-cancel">Cancel</button><button type="button" class="btn btn-primary" id="pos-pay">'+icon('check')+' Pay · F9</button></div>'+
      '</div>'+
    '</div>';

  let search = '', catFilter = '';

  function renderGrid(){
    const grid = document.getElementById('pos-grid');
    let list = D.products.filter(function(p){ return p.status!=='archived'; });
    if(catFilter) list = list.filter(function(p){ return p.categoryId===catFilter; });
    if(search){ const q = search.toLowerCase(); list = list.filter(function(p){ return [p.name,p.sku,p.barcode,p.brand].some(function(v){ return (v||'').toLowerCase().indexOf(q)>-1; }); }); }
    if(!list.length){
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">'+icon('package')+'<p>No products match.</p><button type="button" class="btn btn-primary" id="pos-add-prod">'+icon('plus')+' Add Product</button></div>';
      const ap = document.getElementById('pos-add-prod');
      if(ap) ap.onclick = function(){ navigate('products'); };
      return;
    }
    let html = '';
    list.slice(0,120).forEach(function(p){
      const col = pc(p.colorIdx||0);
      const stock = p.stock||0;
      const isOut = stock<=0 && !D.settings.allowNegativeStock;
      html += '<div class="prod-card'+(isOut?' out':'')+'" data-pid="'+p.id+'"><div class="pc-img" style="background:'+col.bg+';color:'+col.fg+'">'+icon('package',24)+'</div><div class="pc-name">'+esc(p.name)+'</div><div class="pc-meta"><span class="pc-price num">'+money(p.sellingPrice)+'</span><span class="pc-stock">'+stock+' '+esc(p.unit||'pcs')+'</span></div></div>';
    });
    grid.innerHTML = html;
    $$('[data-pid]', grid).forEach(function(el){
      el.onclick = function(){
        const p = Store.find('products', el.dataset.pid);
        if(!p) return;
        if((p.stock||0)<=0 && !D.settings.allowNegativeStock){ toast('Out of stock','warning'); return; }
        addToCart(p);
      };
    });
  }

  function addToCart(p){
    let ex = null;
    for(let i=0;i<App.pos.cart.length;i++) if(App.pos.cart[i].productId===p.id) ex = App.pos.cart[i];
    if(ex){
      if((ex.qty+1)>(p.stock||0) && !D.settings.allowNegativeStock){ toast('Not enough stock','warning'); return; }
      ex.qty++;
    } else {
      App.pos.cart.push({productId:p.id,name:p.name,price:p.sellingPrice,cost:p.purchasePrice||0,tax:p.tax||0,qty:1,discount:0});
    }
    renderCart();
  }

  function renderCart(){
    const cart = App.pos.cart;
    const wrap = document.getElementById('pos-cart');
    if(!cart.length){
      wrap.innerHTML = '<div class="cart-empty">'+icon('cart',32)+'<p style="margin-top:8px">Cart is empty. Click products to add.</p></div>';
    } else {
      let html = '';
      cart.forEach(function(it,idx){
        const line = it.price*it.qty - (it.discount||0);
        html += '<div class="cart-item"><div class="ci-body"><b>'+esc(it.name)+'</b><small>'+money(it.price)+' × '+it.qty+'</small></div>'+
          '<div class="qty-ctrl"><button type="button" data-dec="'+idx+'">−</button><input type="number" min="1" value="'+it.qty+'" data-qty="'+idx+'"/><button type="button" data-inc="'+idx+'">+</button></div>'+
          '<div class="ci-total num">'+money(line)+'</div>'+
          '<button type="button" class="btn-icon" data-del="'+idx+'">'+icon('x',14)+'</button></div>';
      });
      wrap.innerHTML = html;
      $$('[data-inc]', wrap).forEach(function(b){ b.onclick = function(){ const i=+b.dataset.inc; const p=Store.find('products',cart[i].productId); if(cart[i].qty+1>(p.stock||0) && !D.settings.allowNegativeStock){ toast('Not enough stock','warning'); return; } cart[i].qty++; renderCart(); }; });
      $$('[data-dec]', wrap).forEach(function(b){ b.onclick = function(){ const i=+b.dataset.dec; if(cart[i].qty>1) cart[i].qty--; else cart.splice(i,1); renderCart(); }; });
      $$('[data-del]', wrap).forEach(function(b){ b.onclick = function(){ cart.splice(+b.dataset.del,1); renderCart(); }; });
      $$('[data-qty]', wrap).forEach(function(inp){ inp.onchange = function(){ const i=+inp.dataset.qty; const v=Math.max(1,+inp.value||1); cart[i].qty=v; renderCart(); }; });
    }
    const subtotal = sum(cart, function(it){ return it.price*it.qty - (it.discount||0); });
    const discount = Math.max(0, Math.min(subtotal, +App.pos.discount||0));
    const tax = sum(cart, function(it){ const line=it.price*it.qty-(it.discount||0); return line*((it.tax||0)/100); });
    const charges = Math.max(0,+App.pos.additionalCharges||0);
    const total = subtotal - discount + tax + charges;
    const totals = document.getElementById('pos-totals');
    totals.innerHTML = '<div class="cart-row"><span>Subtotal</span><span class="num">'+money(subtotal)+'</span></div>'+
      '<div class="cart-row"><span>Discount</span><input type="number" min="0" value="'+discount+'" id="pos-disc"/></div>'+
      '<div class="cart-row"><span>Tax</span><span class="num">'+money(tax)+'</span></div>'+
      '<div class="cart-row"><span>Additional</span><input type="number" min="0" value="'+charges+'" id="pos-charges"/></div>'+
      '<div class="cart-row grand"><span>Grand Total</span><span class="num">'+money(total)+'</span></div>';
    document.getElementById('pos-disc').onchange = function(e){ App.pos.discount = +e.target.value||0; renderCart(); };
    document.getElementById('pos-charges').onchange = function(e){ App.pos.additionalCharges = +e.target.value||0; renderCart(); };
  }

  document.getElementById('pos-search').oninput = function(e){ search = e.target.value; renderGrid(); };
  document.getElementById('pos-cat').onchange = function(e){ catFilter = e.target.value; renderGrid(); };
  document.getElementById('pos-cust').onchange = function(e){ App.pos.customerId = e.target.value; };
  if(App.pos.customerId) document.getElementById('pos-cust').value = App.pos.customerId;
  document.getElementById('pos-clear').onclick = function(){ App.pos.cart=[]; App.pos.discount=0; App.pos.additionalCharges=0; App.pos.customerId=''; document.getElementById('pos-cust').value=''; renderCart(); };
  document.getElementById('pos-hold').onclick = function(){
    if(!App.pos.cart.length){ toast('Cart is empty','warning'); return; }
    if(!D.heldBills) D.heldBills = [];
    D.heldBills.push({cart:JSON.parse(JSON.stringify(App.pos.cart)), customerId:App.pos.customerId, discount:App.pos.discount, additionalCharges:App.pos.additionalCharges, heldAt:nowISO(), id:uid('hold')});
    Store.save();
    App.pos.cart=[]; App.pos.discount=0; App.pos.additionalCharges=0;
    renderCart(); toast('Bill held');
  };
  document.getElementById('pos-cancel').onclick = function(){ if(!App.pos.cart.length) return; askConfirm('Cancel this bill? Items will be removed.', function(){ App.pos.cart=[]; App.pos.discount=0; App.pos.additionalCharges=0; renderCart(); }); };
  document.getElementById('pos-pay').onclick = function(){ if(!App.pos.cart.length){ toast('Cart is empty','warning'); return; } openPayment(); };

  function openPayment(){
    const cart = App.pos.cart;
    const subtotal = sum(cart, function(it){ return it.price*it.qty - (it.discount||0); });
    const discount = Math.max(0, Math.min(subtotal, +App.pos.discount||0));
    const tax = sum(cart, function(it){ const line=it.price*it.qty-(it.discount||0); return line*((it.tax||0)/100); });
    const total = subtotal - discount + tax + (+App.pos.additionalCharges||0);

    const body =
      '<div style="text-align:center;padding:8px 0 16px"><div style="font-size:12px;color:var(--text-3)">Amount due</div><div style="font-size:32px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums">'+money(total)+'</div></div>'+
      '<div class="form-grid">'+
        field('Payment Method', selectEl('method',[{value:'Cash',label:'Cash'},{value:'UPI',label:'UPI'},{value:'Credit Card',label:'Credit Card'},{value:'Debit Card',label:'Debit Card'},{value:'Bank Transfer',label:'Bank Transfer'},{value:'Credit',label:'Customer Credit'}],'Cash'),{req:true})+
        field('Amount Received', input('amountPaid',total.toFixed(2),'number','min="0" step="0.01"'),{req:true})+
        field('Reference / Txn ID', input('reference','','text','placeholder="Optional"'))+
        field('Notes', input('notes','','text','placeholder="Optional"'))+
      '</div>'+
      '<div style="margin-top:14px;padding:10px;background:var(--surface-2);border-radius:8px;font-size:12px;color:var(--text-2)">Change to return: <b class="num" id="chg">'+money(0)+'</b></div>';

    openModal({
      title:'Complete Payment', body:body, saveText:'Complete Sale',
      onSave: function(data){
        const amtPaid = +data.amountPaid||0;
        const method = data.method;
        if(amtPaid<=0){ toast('Enter amount received','error'); return false; }
        if(method!=='Credit' && amtPaid < total-0.01){ toast('Amount received is less than total','error'); return false; }
        if(method==='Credit' && !App.pos.customerId){ toast('Select a customer for credit sale','error'); return false; }

        const invNo = (D.shop.invoicePrefix||'INV')+'-'+String(D.shop.invoiceNext||1).padStart(5,'0');
        const customer = App.pos.customerId ? Store.find('customers', App.pos.customerId) : null;
        const sale = {
          id: uid('sale'), invoiceNo: invNo, date: nowISO(),
          customerId: App.pos.customerId||null,
          customerName: customer?customer.name:'Walk-in',
          items: cart.map(function(it){ return {productId:it.productId, name:it.name, qty:it.qty, price:it.price, cost:it.cost, tax:it.tax, discount:it.discount||0, lineTotal:(it.price*it.qty-(it.discount||0))}; }),
          subtotal: subtotal, discount: discount, tax: tax, additionalCharges:+App.pos.additionalCharges||0, total: total,
          payments: [{method:method, amount: method==='Credit'?0:Math.min(amtPaid,total), reference:data.reference||'', change:Math.max(0, amtPaid-total)}],
          amountPaid: method==='Credit' ? 0 : Math.min(amtPaid,total),
          balance: method==='Credit' ? total : Math.max(0, total-amtPaid),
          status:'completed',
          notes: data.notes||''
        };

        // Update stock
        cart.forEach(function(it){
          const p = Store.find('products', it.productId);
          if(p){
            const prev = p.stock||0;
            p.stock = prev - it.qty;
            D.stockMovements.unshift({id:uid('sm'), date:nowISO(), productId:p.id, productName:p.name, type:'sale', qty:-it.qty, prev:prev, next:p.stock, reference:invNo, reason:'Sale'});
          }
        });

        D.sales.unshift(sale);
        D.shop.invoiceNext = (D.shop.invoiceNext||1)+1;

        if(method==='Cash' && amtPaid>0){
          D.cashTxns.unshift({id:uid('cash'), date:nowISO(), type:'in', amount:Math.min(amtPaid,total), method:'Cash', category:'Sale', reference:invNo, description:'Sale '+invNo});
        }

        if(customer){
          customer.totalPurchases = (customer.totalPurchases||0) + total;
          customer.transactions = (customer.transactions||0) + 1;
          customer.lastPurchase = nowISO();
          if(method==='Credit') customer.balance = (customer.balance||0) + total;
        }

        Store.save();

        // Reset cart
        App.pos.cart = []; App.pos.discount = 0; App.pos.additionalCharges = 0; App.pos.customerId = '';
        renderCart(); renderGrid();
        const custEl = document.getElementById('pos-cust'); if(custEl) custEl.value='';

        toast('Sale completed: '+invNo);

        // Show invoice preview after modal closes
        setTimeout(function(){ showInvoice(sale); }, 120);
      }
    });

    // Live change calc
    setTimeout(function(){
      const inp = document.querySelector('input[name=amountPaid]');
      const chg = document.getElementById('chg');
      if(inp && chg) inp.oninput = function(){ const v=+inp.value||0; chg.textContent = money(Math.max(0,v-total)); };
    },60);
  }

  renderGrid();
  renderCart();

  document.onkeydown = function(e){
    if(App.route!=='pos'){ document.onkeydown=null; return; }
    if(e.key==='F2'){ e.preventDefault(); const el=document.getElementById('pos-search'); if(el) el.focus(); }
    if(e.key==='F9'){ e.preventDefault(); const el=document.getElementById('pos-pay'); if(el) el.click(); }
    if(e.key==='Escape'){ closeModal(); }
  };
};

function showInvoice(sale){
  const shop = Store.data.shop;
  let itemsHtml = '';
  sale.items.forEach(function(it){ itemsHtml += '<tr><td>'+esc(it.name)+'</td><td class="num">'+it.qty+'</td><td class="num">'+money(it.price)+'</td><td class="num">'+money(it.lineTotal||it.price*it.qty)+'</td></tr>'; });
  const body = '<div class="invoice" id="invoice-print">'+
    '<div class="inv-head"><div><h2>'+esc(shop.name||'PADMA STORE')+'</h2><div>'+esc(shop.address||'')+(shop.city?', '+esc(shop.city):'')+(shop.state?', '+esc(shop.state):'')+'</div><div>'+(shop.phone?'Phone: '+esc(shop.phone):'')+(shop.gstin?' · GSTIN: '+esc(shop.gstin):'')+'</div></div>'+
    '<div style="text-align:right"><div style="font-size:14px;font-weight:700">INVOICE</div><div>'+esc(sale.invoiceNo)+'</div><div>'+fmtDateTime(sale.date)+'</div></div></div>'+
    '<div style="margin-bottom:12px"><b>Bill To:</b> '+esc(sale.customerName)+'</div>'+
    '<table><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>'+itemsHtml+'</tbody></table>'+
    '<div class="totals">'+
      '<div class="row"><span>Subtotal</span><span>'+money(sale.subtotal)+'</span></div>'+
      (sale.discount?'<div class="row"><span>Discount</span><span>-'+money(sale.discount)+'</span></div>':'')+
      (sale.tax?'<div class="row"><span>Tax</span><span>'+money(sale.tax)+'</span></div>':'')+
      (sale.additionalCharges?'<div class="row"><span>Additional</span><span>'+money(sale.additionalCharges)+'</span></div>':'')+
      '<div class="row grand"><span>Total</span><span>'+money(sale.total)+'</span></div>'+
      '<div class="row"><span>Paid</span><span>'+money(sale.amountPaid)+'</span></div>'+
      (sale.balance?'<div class="row"><span>Balance Due</span><span>'+money(sale.balance)+'</span></div>':'')+
    '</div>'+
    '<div style="margin-top:24px;text-align:center;font-size:11px;color:#666">'+esc(Store.data.settings.invoiceFooter||'Thank you for shopping with us!')+'</div>'+
  '</div>';

  openModal({
    title:'Invoice Preview', size:'lg', body:body, saveText:'Print',
    onSave: function(){
      const win = window.open('', '_blank');
      if(!win){ toast('Popup blocked — allow popups to print','warning'); return; }
      win.document.write('<!DOCTYPE html><html><head><title>'+esc(sale.invoiceNo)+'</title><style>body{font-family:system-ui,sans-serif;padding:20px;color:#111}.invoice{max-width:780px;margin:auto}.inv-head{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:16px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px 8px;border-bottom:1px solid #eee;text-align:left}th{background:#f3f4f6;font-size:11px;text-transform:uppercase}.num{text-align:right}.totals{width:280px;margin-left:auto;margin-top:14px;font-size:12px}.totals .row{display:flex;justify-content:space-between;padding:4px 0}.totals .row.grand{border-top:2px solid #111;margin-top:6px;padding-top:8px;font-weight:800;font-size:14px}</style></head><body>'+document.getElementById('invoice-print').outerHTML+'</body></html>');
      win.document.close();
      setTimeout(function(){ win.print(); }, 400);
    }
  });
}

   13. PRODUCTS
   ============================================================ */
ROUTES.products = function(c){
  const D = Store.data;
  const f = App.productFilter;

  c.innerHTML =
    '<div class="page-head"><div><h1>Products</h1><p id="p-count">'+D.products.length+' products registered</p></div>'+
    '<div class="page-actions"><button type="button" class="btn btn-ghost" id="p-export">'+icon('download')+' Export</button><button type="button" class="btn btn-primary" id="p-add">'+icon('plus')+' Add Product</button></div></div>'+
    '<div class="tbl-wrap">'+
      '<div class="tbl-toolbar">'+
        '<div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="p-search" placeholder="Search products..." value="'+esc(f.q)+'"></div>'+
        '<select id="p-cat"><option value="">All Categories</option>'+D.categories.map(function(cat){ return '<option value="'+cat.id+'"'+(f.cat===cat.id?' selected':'')+'>'+esc(cat.name)+'</option>'; }).join('')+'</select>'+
        '<div style="flex:1"></div><small style="color:var(--text-3)" id="p-results"></small>'+
      '</div>'+
      '<div class="tbl-scroll"><table><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th class="num">Stock</th><th class="num">Buy</th><th class="num">Sell</th><th>Status</th><th></th></tr></thead><tbody id="p-tbody"></tbody></table></div>'+
    '</div>';

  function renderBody(){

function openAdjustStock(preSelected){
  const D = Store.data;
  const body = '<div class="form-grid">'+
    field('Product', '<select name="productId" required>'+D.products.map(function(pr){ return '<option value="'+pr.id+'"'+(preSelected&&preSelected.id===pr.id?' selected':'')+'>'+esc(pr.name)+' — '+(pr.stock||0)+' '+esc(pr.unit||'')+'</option>'; }).join('')+'</select>',{req:true,full:true})+
    field('Movement Type', selectEl('type',[{value:'stock_in',label:'Stock In'},{value:'stock_out',label:'Stock Out'},{value:'damage',label:'Damage'},{value:'return',label:'Return'},{value:'correction',label:'Correction (set)'}],'stock_in'),{req:true})+
    field('Quantity', input('qty',1,'number','min="0"'),{req:true})+
    field('Reason', input('reason','','text','placeholder="Optional"'),{full:true})+
  '</div>';

  openModal({
    title:'Adjust Stock', body:body,
    onSave: function(data){
      const prod = Store.find('products', data.productId);
      if(!prod){ toast('Product not found','error'); return false; }
      const qty = +data.qty||0;
      const prev = prod.stock||0;
      let next = prev;
      if(data.type==='stock_in'||data.type==='return') next = prev+qty;
      else if(data.type==='stock_out'||data.type==='damage') next = prev-qty;
      else if(data.type==='correction') next = qty;
      if(next<0 && !D.settings.allowNegativeStock){ toast('Stock cannot be negative','error'); return false; }
      prod.stock = next;
      D.stockMovements.unshift({id:uid('sm'), date:nowISO(), productId:prod.id, productName:prod.name, type:data.type, qty:next-prev, prev:prev, next:next, reason:data.reason||data.type});
      Store.save();
      toast('Stock adjusted');
      renderRoute();
    }
  });
}

function openPurchaseModal(){
  const D = Store.data;
  if(!D.products.length){ toast('Add products first','warning'); return; }
  let itemsHtml = '<div style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:10px">';
  D.products.slice(0,60).forEach(function(p){
    itemsHtml += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)"><input type="checkbox" data-pid="'+p.id+'"/>'+
      '<span style="flex:1;font-size:12.5px">'+esc(p.name)+'</span>'+
      '<input type="number" min="0" value="0" data-qty="'+p.id+'" placeholder="Qty" style="width:70px;padding:3px 6px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text);font-size:12px"/>'+
      '<input type="number" min="0" step="0.01" value="'+(p.purchasePrice||0)+'" data-price="'+p.id+'" style="width:80px;padding:3px 6px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text);font-size:12px"/></div>';
  });
  itemsHtml += '</div>';

  const body = '<div class="form-grid">'+
    field('Supplier', '<select name="supplierId">'+D.suppliers.map(function(s){ return '<option value="'+s.id+'">'+esc(s.businessName)+'</option>'; }).join('')+'</select>')+
    field('Invoice No', input('invoiceNo','PUR-'+Date.now().toString(36).toUpperCase(),'text'))+
    field('Date', input('date',todayISO(),'date'))+
  '</div><div style="margin-top:14px"><b style="font-size:12.5px">Items</b></div>'+itemsHtml;

  openModal({
    title:'New Purchase', size:'lg', body:body,
    onSave: function(data){
      const supplier = Store.find('suppliers', data.supplierId);
      const items = [];
      $$('[data-pid]').forEach(function(cb){
        if(!cb.checked) return;
        const pid = cb.dataset.pid;
        const qEl = document.querySelector('[data-qty="'+pid+'"]');
        const pEl = document.querySelector('[data-price="'+pid+'"]');
        const qty = qEl ? +qEl.value||0 : 0;
        const price = pEl ? +pEl.value||0 : 0;
        if(qty>0){
          const p = Store.find('products', pid);
          if(p) items.push({productId:pid, name:p.name, qty:qty, price:price, lineTotal:qty*price});
        }
      });
      if(!items.length){ toast('Add at least one item','error'); return false; }
      const total = sum(items, function(it){ return it.lineTotal; });
      const purchase = {
        id:uid('pur'), invoiceNo:data.invoiceNo, date:data.date+'T'+new Date().toTimeString().slice(0,8),
        supplierId:data.supplierId, supplierName:supplier?supplier.businessName:'',
        items:items, total:total, amountPaid:total, status:'received', createdAt:nowISO()
      };
      items.forEach(function(it){
        const p = Store.find('products', it.productId);
        if(p){
          const prev = p.stock||0;
          p.stock = prev + it.qty;
          p.purchasePrice = it.price;
          D.stockMovements.unshift({id:uid('sm'),date:nowISO(),productId:p.id,productName:p.name,type:'purchase',qty:it.qty,prev:prev,next:p.stock,reference:data.invoiceNo});
        }
      });
      D.purchases.unshift(purchase);
      Store.save();
      toast('Purchase recorded'); renderRoute();
    }
  });
}

ROUTES.calendar = function(c){
  const D = Store.data;
  const cursor = App.page.calDate ? new Date(App.page.calDate) : new Date();
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const first = new Date(year, month, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=startDay-1;i>=0;i--) cells.push({d:new Date(year,month,0).getDate()-i, other:true, date:new Date(year,month-1,new Date(year,month,0).getDate()-i)});
  for(let i=1;i<=daysInMonth;i++) cells.push({d:i, other:false, date:new Date(year,month,i)});
  while(cells.length%7!==0) cells.push({d:cells.length-30-startDay+1,other:true,date:null});

  let gridHtml = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join('');
  cells.forEach(function(cell){
    if(!cell.date){ gridHtml += '<div class="cal-day other"></div>'; return; }
    const dstr = cell.date.toISOString().slice(0,10);
    const evts = D.events.filter(function(e){ return e.date===dstr; });
    const isToday = dstr===todayISO();
    let evtsHtml = '';
    evts.forEach(function(e){ evtsHtml += '<div class="cal-evt" title="'+esc(e.title)+'">'+esc(e.title)+'</div>'; });
    gridHtml += '<div class="cal-day '+(cell.other?'other':'')+' '+(isToday?'today':'')+'"><div class="cd-num">'+cell.d+'</div>'+evtsHtml+'</div>';
  });

  c.innerHTML = '<div class="page-head"><div><h1>Calendar</h1><p>Events and schedules</p></div><div class="page-actions">'+
    '<button type="button" class="btn btn-ghost" id="cal-prev">'+icon('chevleft')+'</button>'+
    '<button type="button" class="btn btn-ghost" id="cal-today">Today</button>'+
    '<button type="button" class="btn btn-ghost" id="cal-next">'+icon('chevright')+'</button>'+
    '<button type="button" class="btn btn-primary" id="cal-add">'+icon('plus')+' Add Event</button></div></div>'+
    '<div style="margin-bottom:12px;font-size:15px;font-weight:700">'+cursor.toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'</div>'+
    '<div class="cal-grid">'+gridHtml+'</div>';

  document.getElementById('cal-prev').onclick = function(){ cursor.setMonth(cursor.getMonth()-1); App.page.calDate = cursor.toISOString(); renderRoute(); };
  document.getElementById('cal-next').onclick = function(){ cursor.setMonth(cursor.getMonth()+1); App.page.calDate = cursor.toISOString(); renderRoute(); };
  document.getElementById('cal-today').onclick = function(){ App.page.calDate = null; renderRoute(); };
  document.getElementById('cal-add').onclick = function(){
    const body = '<div class="form-grid">'+
      field('Title', input('title','','text','required'),{req:true,full:true})+
      field('Date', input('date',todayISO(),'date'),{req:true})+
      field('Category', selectEl('category',[{value:'Business',label:'Business'},{value:'Payment',label:'Payment'},{value:'Meeting',label:'Meeting'},{value:'Holiday',label:'Holiday'}],'Business'))+
      field('Notes', '<textarea name="notes"></textarea>',{full:true})+
    '</div>';
    openModal({title:'New Event', body:body, onSave:function(data){
      if(!data.title||!data.title.trim()){ toast('Title required','error'); return false; }
      Store.add('events', data); toast('Event added'); renderRoute();
    }});
  };
};

  document.getElementById('bk-export').onclick = function(){
    const backup = {app:'PADMA RMS', version:1, exportedAt:nowISO(), data:Store.data};

    toast('Backup exported');

  document.getElementById('bk-import').onclick = function(){ document.getElementById('bk-file').click(); };
  document.getElementById('bk-file').onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      try {
        const parsed = JSON.parse(ev.target.result);
        const data = parsed.data || parsed;
        if(!data.shop || !data.products){ toast('Invalid backup file','error'); return; }
        askConfirm('Restore backup? This will REPLACE current data.', function(){
          Store.data = data;
          const def = DEFAULTS();
          for(const k in def){ if(Store.data[k]===undefined) Store.data[k]=def[k]; }
          Store.save();
          document.documentElement.dataset.theme = (data.settings&&data.settings.theme)||'light';
          toast('Backup restored');
          setTimeout(function(){ navigate('dashboard'); }, 400);
        });
      } catch(err){ console.error(err); toast('Invalid JSON file','error'); }
    };
    reader.readAsText(file);
  };
};
